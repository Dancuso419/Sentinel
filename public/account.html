<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — Sentinel</title>
  <link rel="stylesheet" href="css/style.css">
  <script>try{var r=localStorage.getItem('sentinel.rail');if(r?r==='open':innerWidth>=1200)document.documentElement.classList.add('rail-open')}catch(e){}</script>
</head>
<body>
  <nav class="rail" aria-label="Main">
    <div class="rail-head">
      <span class="rail-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="4" cy="12" r="3" fill="currentColor"/>
          <path d="M7 12h4M13 12h4" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
          <circle cx="20" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </span>
      <span class="rail-wordmark">Sentinel</span>
    </div>

    <!-- href and label are filled in from the signed-in role by rail.js -->
    <a class="rail-link" id="rail-home" href="index.html" data-label="Dashboard">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="rail-label">Dashboard</span>
    </a>

    <span class="rail-divider rail-spacer" aria-hidden="true"></span>

    <a class="rail-link rail-account" id="rail-account" href="account.html" aria-current="page" data-label="Account">
      <span class="rail-avatar" data-account="initials" aria-hidden="true">··</span>
      <span class="rail-label">
        <span class="rail-account-name" data-account="name">Loading…</span>
        <span class="rail-account-role" data-account="role"></span>
      </span>
    </a>

    <button class="rail-link" id="logout-btn" type="button" data-label="Log out">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8 3H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 7l3 3-3 3M15 10H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="rail-label">Log out</span>
    </button>

    <button class="rail-link rail-toggle" id="rail-toggle" type="button" aria-expanded="false" aria-label="Expand sidebar" data-label="Expand sidebar">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 5.5 12 10l-4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="rail-label">Collapse</span>
    </button>
  </nav>

  <main class="app-main">
    <div class="app-head">
      <div>
        <h1>Account</h1>
        <p class="muted">The account this browser is signed in as.</p>
      </div>
    </div>

    <div class="account-split">
      <div class="card">
        <div class="card-head">
          <h2>Signed in as</h2>
        </div>

        <div class="account-identity">
          <span class="account-avatar" id="account-initials" aria-hidden="true">··</span>
          <div>
            <p class="account-name" id="account-name">Loading…</p>
            <p class="muted" id="account-email"></p>
          </div>
        </div>

        <dl class="demo-meta" style="margin-top: var(--s-lg)">
          <div><dt>Role</dt><dd id="account-role">—</dd></div>
          <div><dt>Account created</dt><dd class="mono" id="account-created">—</dd></div>
        </dl>

        <p class="field-hint" id="account-scope" style="margin-top: var(--s-md)"></p>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Change password</h2>
        </div>

        <form id="password-form" novalidate>
          <label class="field">
            <span>Current password</span>
            <input name="current_password" type="password" autocomplete="current-password" required>
          </label>
          <label class="field">
            <span>New password</span>
            <input name="new_password" type="password" autocomplete="new-password" minlength="8" required>
            <span class="field-hint">At least 8 characters. There is no email recovery in this
              system, so choose one you will remember.</span>
          </label>
          <label class="field">
            <span>Confirm new password</span>
            <input name="confirm_password" type="password" autocomplete="new-password" required>
          </label>
          <button class="btn btn-submit" type="submit">Update password</button>
          <p id="password-message" class="msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/rail.js"></script>
  <script src="js/account.js"></script>
  <script src="js/password-toggle.js"></script>
</body>
</html>
