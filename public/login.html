<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Sentinel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html">
      <svg class="wordmark-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="4" cy="12" r="3" fill="currentColor"/>
        <path d="M7 12h4M13 12h4" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
        <circle cx="20" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      Sentinel
    </a>
    <nav class="site-nav">
      <a href="report.html">Report</a>
      <a href="track.html">Track</a>
    </nav>
  </header>

  <main class="container container-task task-page">
    <div class="task-head">
      <h1>Log in</h1>
      <p>For citizens tracking their own reports, and for officers and administrators working the
        case queue.</p>
    </div>

    <div class="task-card">
      <form id="login-form" novalidate>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-submit" type="submit">Log in</button>
        <p id="message" class="msg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <p class="task-alt">No account? <a href="register.html">Register as a citizen</a> — or
      <a href="report.html">report without one</a>.</p>
  </main>

  <footer class="site-footer">
    <span>Sentinel — Computerized Crime Reporting and Tracking System (CCRTS).</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="report.html">Report</a>
      <a href="track.html">Track</a>
    </nav>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
  <script src="js/password-toggle.js"></script>
</body>
</html>
